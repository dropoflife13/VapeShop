<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLACK ELITE 60000 - 3D breakdown</title>
<style>
  :root{--bg1:#343841;--bg2:#0b0c0e;--acc:#f2b300;--shadow-a:.35}
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f2f3f5}
  body{background:radial-gradient(ellipse at 40% 45%,var(--bg1),var(--bg2) 88%)}
  body.embed,body.transparent{background:transparent;--shadow-a:.08}
  /* soft contact shadow: one blurred gradient ellipse, placed under the base by the script (no shadow maps) */
  #shadow{position:fixed;left:0;top:0;width:140px;height:34px;margin:-17px 0 0 -70px;border-radius:50%;pointer-events:none;opacity:0;
    background:radial-gradient(closest-side,rgba(0,0,0,var(--shadow-a)),rgba(0,0,0,0));filter:blur(14px);will-change:transform;transition:opacity .6s ease}
  #c{position:fixed;inset:0}
  #c canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
  #c canvas:active{cursor:grabbing}
  /* very subtle vignette; hidden when the page background is transparent */
  #vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 150px 30px rgba(0,0,0,.18)}
  body.embed #vig,body.transparent #vig{display:none}
  #lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #lines line{stroke:#ffffff66;stroke-width:1}
  #lines circle{fill:var(--acc)}
  #lines .hot{stroke:var(--acc);stroke-width:1.5}
  #labels .lb{position:fixed;right:14px;transform:translateY(-50%);display:flex;gap:7px;align-items:center;max-width:46vw;
    font-size:12px;line-height:1.2;padding:5px 10px;border-radius:999px;background:#00000066;border:1px solid #ffffff22;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:default;white-space:nowrap}
  #labels .lb b{font-weight:600}
  #labels .lb i{font-style:normal;opacity:.55;font-size:11px;overflow:hidden;text-overflow:ellipsis}
  #labels .lb.hot{border-color:var(--acc);background:#f2b30033}
  #labels .n{opacity:.5;font-variant-numeric:tabular-nums}
  #ui{position:fixed;left:14px;bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:60vw}
  #ui button{font:inherit;font-size:12px;font-weight:600;color:#f8fafc;background:rgba(12,12,16,.72);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:8px 16px;cursor:pointer;backdrop-filter:blur(8px)}
  #ui button:focus-visible,#ui input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  #ui label{font-size:12px;opacity:.75;display:flex;gap:8px;align-items:center}
  #ui input[type=range]{width:150px;accent-color:var(--acc)}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:14px}
  body.embed #ui{display:none}
  @media (max-width:640px){#labels .lb i{display:none}#labels .lb{font-size:11px;padding:4px 8px}}
  @media (prefers-reduced-motion:reduce){#shadow{transition:none}}
</style>
<!--
  BLACK ELITE 60000: interactive 3D breakdown (exploded view). The model is embedded below (base64 .glb).
  Drag to rotate 360 degrees. Use the slider (or Explode/Assemble) to pull the parts apart.
  Hover a label (or a part) to highlight it. Needs internet for three.js (jsDelivr CDN).
  ?embed = transparent background, no buttons.  ?transparent = transparent background, keeps buttons.
-->
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<style id="assembled-override">
  html.transparent, html.transparent body { background: transparent !important; }
  html.transparent #vig, html.transparent #ui, body.transparent #ui { display: none !important; }
  #labels, #lines, #ex, #sl, #ui label { display: none !important; }
  #ui { left: 50% !important; transform: translateX(-50%); bottom: 10px !important; }
  #ui button { background: var(--acc, #B6FF4D) !important; color: var(--acc-ink, #0C1804) !important; border-color: transparent !important; font-weight: 800 !important; font-size: 11px !important; letter-spacing: 0.1em; text-transform: uppercase; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
</style>
<script>
if(/[?&]transparent/.test(location.search))document.documentElement.classList.add('transparent');
(function(){var p=new URLSearchParams(location.search),a=p.get('accent'),ai=p.get('accentInk');if(a)document.documentElement.style.setProperty('--acc',a);if(ai)document.documentElement.style.setProperty('--acc-ink',ai);})();
</script>
</head>
<body>
<div id="shadow" aria-hidden="true"></div>
<div id="c"></div>
<div id="vig" aria-hidden="true"></div>
<svg id="lines"></svg>
<div id="labels"></div>
<div id="ui">
  <button id="ex" type="button">Assemble</button>
  <label>Explode <input id="sl" type="range" min="0" max="100" value="0" aria-label="Explode amount"></label>
  <button id="spin" type="button">Pause spin</button>
</div>
<div id="err">The 3D viewer could not start. Check your connection and that WebGL is enabled.</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- TWEAK HERE ---------------- */
const LIQUID_TINT = 0xd5a527;       // the ONE liquid colour: theme the shop here (emissive + rim are derived from it)
const AUTO_SPIN = 0.45;                 // radians/second (0 = off)
// how far each part lifts when fully exploded (millimetres)
const LIFT = { Base: 0, Vent_Slots: 0, Rings_Core: 5, Rings_Fins: 14, Tank_Liquid: 26, Tank_Glass: 56, Label: 56,
               Top_Cap: 66, Collar: 74, Mouthpiece_Shell: 84, Mouthpiece_Nozzle: 104, Nozzle_Ring: 112 };
// labels, top to bottom: [mesh, title, detail]
const PARTS = [
  ['Nozzle_Ring', 'Nozzle ring', 'chrome'],
  ['Mouthpiece_Nozzle', 'Nozzle', 'chrome'],
  ['Mouthpiece_Shell', 'Mouthpiece', 'clear ridged plastic'],
  ['Collar', 'Collar', 'chrome'],
  ['Top_Cap', 'Top cap', 'chrome, bevelled'],
  ['Label', 'Printed label', 'BLACK ELITE 60000'],
  ['Tank_Glass', 'Glass casing', 'clear, faceted'],
  ['Tank_Liquid', 'E-liquid', 'golden, 80% full'],
  ['Rings_Fins', 'Ring fins', '4 chrome rings'],
  ['Rings_Core', 'Ring core', 'black gloss'],
  ['Vent_Slots', 'Vent slots', '4 front + 4 back'],
  ['Base', 'Base', 'brushed aluminium']
];
// liquid column in Tank_Liquid LOCAL space (metres); the shader masks the wave with these
const LIQ_TOP = 0.0596, LIQ_BOT = 0.0244;
/* -------------------------------------------- */

const q = location.search;
if (/[?&]embed/.test(q)) document.body.classList.add('embed');
if (/[?&]transparent/.test(q)) document.body.classList.add('transparent');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;
const MM = 0.001, H0 = 0.077, H_EXTRA = 0.112;
const clamp = THREE.MathUtils.clamp;

let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
catch (e) { document.getElementById('err').style.display = 'flex'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, coarse ? 1.75 : 2));
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.NoToneMapping;
const host = document.getElementById('c'); host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 5);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
// soft lighting: lower key/fill + a hemisphere wash, so chrome gets broad highlights instead of hard hotspots
const key = new THREE.DirectionalLight(0xffffff, 1.05); key.position.set(-0.6, 0.9, 1.2); scene.add(key);
const fill = new THREE.DirectionalLight(0xfff1d6, 0.35); fill.position.set(1, 0.2, 0.6); scene.add(fill);
scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2d33, 0.35));

/* ---- materials: clear glass / plastic, living liquid ---- */
const glassMat = (opacity) => new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity, roughness: 0.02, metalness: 0,
  clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.6, depthWrite: false, side: THREE.DoubleSide });

/* Liquid: stock MeshPhysicalMaterial + GLSL injected via onBeforeCompile. All motion is in the vertex shader
   (local-space `position` only, so the explode offset on mesh.position never touches the wave).
   One packed uniform, uLive = (time, amplitude, slosh.x, slosh.z), is the only per-frame write. */
const LQ_COMMON = /* glsl */`
uniform vec4 uLive;
varying float vLiqY;
#define LQ_TOP ${LIQ_TOP.toFixed(4)}
#define LQ_BOT ${LIQ_BOT.toFixed(4)}
`;
const LQ_VERT_FN = /* glsl */`
// three slow sines: roll along Y, cross ripple in XZ, radial ring from the axis. Max sum = 0.8 mm.
float lqWave(vec3 p, float t) {
  float a = sin(p.y * 210.0 + p.x * 55.0 + t * 0.85);
  float b = sin(p.x * 170.0 - p.z * 120.0 - t * 1.10 + 1.7);
  float c = sin(length(p.xz) * 250.0 - t * 1.45 + 0.6);
  return a * 0.00035 + b * 0.00025 + c * 0.00020;
}
// full displacement vector, a pure function of local position (no cracks between split vertices)
vec3 lqDisp(vec3 p) {
  float surf = smoothstep(LQ_BOT + 0.004, LQ_TOP, p.y);                        // floor stays glued, meniscus moves
  float edge = 1.0 - smoothstep(0.65, 1.0, length(vec2(p.x * 50.0, p.z * 71.4286))); // keep walls off the glass in XZ
  float w    = lqWave(p, uLive.x) * uLive.y * surf;
  float tilt = (p.x * uLive.z + p.z * uLive.w) * 0.1 * surf;                  // 0.002 m at x = 0.02 m when slosh = 1
  return vec3(w * 0.3 * edge, w + tilt, -w * 0.3 * edge);
}
`;
const LQ_NORMAL = /* glsl */`
{
  // finite-difference normal of the displaced surface, applied as a perturbation of the original normal
  // (weighted by how "up" the face is, so side walls keep their own normals)
  const float eps = 0.0012;
  vec3 d0 = lqDisp(position);
  vec3 tx = vec3(eps, 0.0, 0.0) + lqDisp(position + vec3(eps, 0.0, 0.0)) - d0;
  vec3 tz = vec3(0.0, 0.0, eps) + lqDisp(position + vec3(0.0, 0.0, eps)) - d0;
  vec3 nTop = normalize(cross(tz, tx));
  float cap = smoothstep(0.5, 0.95, objectNormal.y);
  objectNormal = normalize(objectNormal + (nTop - vec3(0.0, 1.0, 0.0)) * cap);
}
`;
const LQ_FRAG_COLOR = /* glsl */`
{
  // slow vertical gradient (deeper at the bottom, brighter near the top) with a faint band travelling up the column
  float yN = clamp((vLiqY - LQ_BOT) / (LQ_TOP - LQ_BOT), 0.0, 1.0);
  float band = sin(vLiqY * 160.0 - uLive.x * 0.15 * 6.2831853);
  diffuseColor.rgb *= clamp(mix(0.84, 1.05, yN) + band * 0.03, 0.8, 1.08);
}
`;
const LQ_FRAG_RIM = /* glsl */`
{
  // thin fresnel rim in a lightened version of the tint; additive and capped, so nothing blows out
  float fr = pow(1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0), 3.0);
  totalEmissiveRadiance += mix(diffuseColor.rgb, vec3(1.0), 0.45) * min(fr * 0.12, 0.12);
}
`;
const liquidMat = () => {
  const m = new THREE.MeshPhysicalMaterial({
    color: LIQUID_TINT, roughness: 0.20, metalness: 0.0,
    clearcoat: 1.0, clearcoatRoughness: 0.06,
    emissive: new THREE.Color(LIQUID_TINT).multiplyScalar(0.27), emissiveIntensity: 0.45, envMapIntensity: 0.95
  });
  m.userData.u = { uLive: { value: new THREE.Vector4(0, reduceMotion ? 0.35 : 1.0, 0, 0) } };
  m.customProgramCacheKey = () => 'liquid-soft-v1';
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uLive = m.userData.u.uLive;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\n' + LQ_COMMON + LQ_VERT_FN)
      .replace('#include <beginnormal_vertex>', '#include <beginnormal_vertex>\n' + LQ_NORMAL)
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n  transformed += lqDisp(position);\n  vLiqY = position.y;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + LQ_COMMON)
      .replace('#include <color_fragment>', '#include <color_fragment>\n' + LQ_FRAG_COLOR)
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n' + LQ_FRAG_RIM);
    m.userData.shader = sh;
  };
  return m;
};

const rig = new THREE.Group(); rig.rotation.order = 'ZYX'; scene.add(rig);   // ZYX: the idle roll leans in the screen plane
const parts = {};                      // name -> { mesh, lift, anchor(local Vector3), label, line, dot }
const meshes = [];
let liquidLive = null;                 // Vector4 behind uLive (set once the liquid mesh exists)

const bytes = Uint8Array.from(atob(document.getElementById('glb').textContent.trim()), (c) => c.charCodeAt(0));
new GLTFLoader().parse(bytes.buffer, '', (gltf) => {
  const model = gltf.scene; rig.add(model);
  model.traverse((o) => {
    if (!o.isMesh) return;
    if (o.name === 'Tank_Glass') o.material = glassMat(0.16);
    else if (o.name === 'Mouthpiece_Shell') o.material = glassMat(0.26);
    else if (o.name === 'Tank_Liquid') { o.material = liquidMat(); liquidLive = o.material.userData.u.uLive.value; }
    else if (o.name === 'Label') { o.material.polygonOffset = true; o.material.polygonOffsetFactor = -2; o.material.depthWrite = false; }
    else if (o.material) {
      o.material = o.material.clone();
      const mt = o.material;
      if (mt.metalness > 0.9) { mt.roughness = Math.max(mt.roughness, Math.min(mt.roughness + 0.06, 0.45)); mt.envMapIntensity = 1.15; }
    }
    if (o.name === 'Tank_Glass' || o.name === 'Mouthpiece_Shell') o.renderOrder = 3;
    if (o.name === 'Label') o.renderOrder = 4;
    o.material.userData.e0 = o.material.emissive ? o.material.emissive.clone() : null;
    o.material.userData.i0 = o.material.emissiveIntensity;
    o.geometry.computeBoundingBox();
    const bb = o.geometry.boundingBox, c = bb.getCenter(new THREE.Vector3());
    const anchor = new THREE.Vector3(bb.max.x * 0.92, c.y, o.name === 'Vent_Slots' ? bb.max.z : c.z);
    parts[o.name] = { mesh: o, base: o.position.y, lift: (LIFT[o.name] || 0) * MM, anchor };
    meshes.push(o);
  });
  buildLabels();
}, () => { document.getElementById('err').style.display = 'flex'; });

/* ---- labels + leader lines ---- */
const labelsEl = document.getElementById('labels'), svg = document.getElementById('lines');
const NS = 'http://www.w3.org/2000/svg'; let hot = null;
function buildLabels() {
  PARTS.forEach(([name, title, detail], i) => {
    const p = parts[name]; if (!p) return;
    const el = document.createElement('div'); el.className = 'lb';
    el.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><b>${title}</b><i>${detail}</i>`;
    el.addEventListener('pointerenter', () => setHot(name)); el.addEventListener('pointerleave', () => setHot(null));
    el.addEventListener('click', () => setHot(hot === name ? null : name));
    labelsEl.appendChild(el);
    p.label = el; p.line = document.createElementNS(NS, 'line'); p.dot = document.createElementNS(NS, 'circle'); p.dot.setAttribute('r', 3);
    svg.appendChild(p.line); svg.appendChild(p.dot);
  });
}
function setHot(name) {
  hot = name;
  for (const n in parts) {
    const p = parts[n], on = n === name, m = p.mesh.material;
    if (m.emissive && m.userData.e0) {
      if (on) { m.emissive.setRGB(0.95, 0.65, 0.05); m.emissiveIntensity = 0.55; }
      else { m.emissive.copy(m.userData.e0); m.emissiveIntensity = m.userData.i0; }
    }
    if (p.label) p.label.classList.toggle('hot', on);
    if (p.line) p.line.classList.toggle('hot', on);
  }
}
const v3 = new THREE.Vector3();
function layoutLabels(w, h) {
  const items = [];
  for (const [name] of PARTS) {
    const p = parts[name]; if (!p || !p.label) continue;
    v3.copy(p.anchor); p.mesh.localToWorld(v3); v3.project(camera);
    items.push({ p, ax: (v3.x * 0.5 + 0.5) * w, ay: (-v3.y * 0.5 + 0.5) * h });
  }
  items.sort((a, b) => a.ay - b.ay);
  let prev = -1e9; const gap = Math.max(22, Math.min(30, (h - 120) / Math.max(items.length, 1)));
  for (const it of items) { it.ly = Math.max(it.ay, prev + gap); prev = it.ly; }
  const over = prev - (h - 24); if (over > 0) for (const it of items) it.ly -= over;
  for (const it of items) {
    const el = it.p.label; el.style.top = it.ly + 'px';
    const lx = w - 14 - el.offsetWidth - 6;
    it.p.line.setAttribute('x1', it.ax); it.p.line.setAttribute('y1', it.ay); it.p.line.setAttribute('x2', lx); it.p.line.setAttribute('y2', it.ly);
    it.p.dot.setAttribute('cx', it.ax); it.p.dot.setAttribute('cy', it.ay);
  }
}

/* ---- contact shadow: follows the projected base; DOM is only touched when the position actually changes ---- */
const shadowEl = document.getElementById('shadow');
let shX = -1e9, shY = -1e9, shK = -1;
function placeShadow(w, h) {
  v3.set(0, 0, 0).project(camera);
  const cx = (v3.x * 0.5 + 0.5) * w, cy = (-v3.y * 0.5 + 0.5) * h;
  v3.set(0.022, 0, 0).project(camera);                                   // base radius ~22 mm
  const k = Math.max(Math.abs((v3.x * 0.5 + 0.5) * w - cx) * 2 / 140, 0.2);
  if (Math.abs(cx - shX) < 0.4 && Math.abs(cy - shY) < 0.4 && Math.abs(k - shK) < 0.004) return;
  shX = cx; shY = cy; shK = k;
  shadowEl.style.transform = `translate(${cx.toFixed(1)}px,${cy.toFixed(1)}px) scale(${k.toFixed(3)})`;
  shadowEl.style.opacity = '1';
}

/* ---- rotation, explode, camera ---- */
let th = 0.55, om = 0, pitch = 0.1, e = 0, eTarget = 0, spinOn = AUTO_SPIN > 0 && !reduceMotion;
let drag = false, lx = 0, ly = 0, lt = 0, idle = 0, startAt = 0;
const el = renderer.domElement;
el.addEventListener('pointerdown', (ev) => { drag = true; lx = ev.clientX; ly = ev.clientY; lt = performance.now(); el.setPointerCapture(ev.pointerId); });
const ray = new THREE.Raycaster(), mv = new THREE.Vector2();
el.addEventListener('pointermove', (ev) => {
  if (drag) {
    const now = performance.now(), dt = Math.max((now - lt) / 1000, 0.001), d = (ev.clientX - lx) * 0.012;
    th += d; om = om * 0.6 + (d / dt) * 0.4; pitch = Math.max(-0.45, Math.min(0.55, pitch + (ev.clientY - ly) * 0.006));
    lx = ev.clientX; ly = ev.clientY; lt = now; idle = 0;
  } else {
    const r = el.getBoundingClientRect(); mv.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mv, camera);
    const hit = ray.intersectObjects(meshes.filter((m) => m.name !== 'Label'))[0];
    const name = hit ? hit.object.name : null; if (name !== hot) setHot(name);
  }
});
const up = () => { drag = false; };
el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
el.addEventListener('pointerleave', () => setHot(null));

const sl = document.getElementById('sl'), exBtn = document.getElementById('ex'), spinBtn = document.getElementById('spin');
function syncUI() { exBtn.textContent = eTarget > 0.5 ? 'Assemble' : 'Explode'; sl.value = Math.round(eTarget * 100); }
exBtn.onclick = () => { eTarget = eTarget > 0.5 ? 0 : 1; syncUI(); };
sl.oninput = () => { eTarget = sl.value / 100; e = eTarget; exBtn.textContent = eTarget > 0.5 ? 'Assemble' : 'Explode'; };
spinBtn.onclick = () => { spinOn = !spinOn; spinBtn.textContent = spinOn ? 'Pause spin' : 'Resume spin'; };
if (reduceMotion) { eTarget = 0; e = 0; }
sl.value = 0; eTarget = 0; syncUI();

let W = 1, Hh = 1;
function resize() {
  W = host.clientWidth || innerWidth; Hh = host.clientHeight || innerHeight;
  renderer.setSize(W, Hh, false); camera.aspect = W / Hh;
  if (W > 900) camera.setViewOffset(W, Hh, W * 0.07, 0, W, Hh); else camera.clearViewOffset();   // leave room for the labels
}
function placeCamera(s) {
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const H = H0 + H_EXTRA * s;
  const d = Math.max((H / 2 + 0.012) / t, 0.036 / (t * camera.aspect) * (W < 640 ? 1.5 : 1.9)) * (document.body.classList.contains('transparent') ? 1.08 : 1);
  camera.position.set(0, H / 2 + d * Math.sin(pitch), d * Math.cos(pitch));
  camera.lookAt(0, H / 2, 0); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
}
new ResizeObserver(resize).observe(host); resize();

/* ---- liquid + idle state (plain scalars, no allocation per frame) ---- */
const FLOW_RATE = reduceMotion ? 0.5 : 1;          // calmer flow under reduced motion
const SLOSH_GAIN = reduceMotion ? 0.35 : 1;
const SLOSH_K = 60, SLOSH_C = 6;                   // underdamped spring: ~26% overshoot, settled in ~1 s
let flowT = 0, amp = reduceMotion ? 0.35 : 1, omLag = 0, slV = 0, slS = 0, floatT = 0;

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.033);
  if (startAt > 0 && performance.now() > startAt && !reduceMotion) { eTarget = 0; syncUI(); startAt = 0; }
  e += (eTarget - e) * Math.min(dt * 3.2, 1);
  if (drag) om *= Math.pow(0.02, dt);
  else {
    idle += dt; const target = (spinOn && idle > 1.0) ? AUTO_SPIN : 0;
    om += (target - om) * Math.min(dt * (target ? 1.5 : 2.5), 1); th += om * dt;
    pitch += (0.1 - pitch) * Math.min(dt * 1.5, 1);
  }
  const s = e * e * (3 - 2 * e);                      // eased explode amount
  for (const n in parts) { const p = parts[n]; p.mesh.position.y = p.base + p.lift * s; }

  // idle life: sub-millimetre float + micro roll (frozen under reduced motion)
  let roll = 0;
  if (!reduceMotion) { floatT += dt; rig.position.y = Math.sin(floatT * 0.6) * 0.0004; roll = Math.sin(floatT * 0.45) * 0.004; }
  rig.rotation.set(0, th, roll); rig.updateMatrixWorld(true);

  // liquid: the single per-frame uniform write. Slosh is a spring driven by angular ACCELERATION
  // (om minus its lagged copy), so steady auto-spin does not tilt the surface; it is projected onto the
  // world-X axis in model space so the tilt stays screen-aligned while the model turns.
  if (liquidLive) {
    amp += ((reduceMotion ? 0.35 : 1 + 0.25 * s) - amp) * Math.min(dt * 2, 1);   // livelier when exploded, calm when assembled
    omLag += (om - omLag) * Math.min(dt * 5, 1);
    slV += (SLOSH_K * ((omLag - om) * 0.35 * SLOSH_GAIN - slS) - SLOSH_C * slV) * dt;
    slS = clamp(slS + slV * dt, -1, 1);
    flowT += dt * FLOW_RATE;
    liquidLive.set(flowT, amp, slS * Math.cos(th), slS * Math.sin(th));
  }

  placeCamera(s);
  placeShadow(W, Hh);
  layoutLabels(W, Hh);
  renderer.render(scene, camera);
}

/* ---- run only while visible: off-screen canvas or hidden tab stops the loop completely ---- */
let onScreen = true, tabVisible = !document.hidden, looping = false;
function syncLoop() {
  const want = onScreen && tabVisible;
  if (want && !looping) { clock.getDelta(); renderer.setAnimationLoop(frame); looping = true; }
  else if (!want && looping) { renderer.setAnimationLoop(null); looping = false; }
}
if ('IntersectionObserver' in window) {
  new IntersectionObserver((entries) => { onScreen = entries[entries.length - 1].isIntersecting; syncLoop(); }, { threshold: 0 }).observe(host);
}
document.addEventListener('visibilitychange', () => { tabVisible = !document.hidden; syncLoop(); });
syncLoop();
</script>
</body>
</html>
