<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vape 360° Viewer</title>
<style>
:root{--bg1:#f4f5f7;--bg2:#cfd3da;--fg:#14171c;--panel:#ffffffcc;--line:#0002;--acc:#2f6bff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b1e24;--bg2:#07080a;--fg:#eef0f4;--panel:#14171dcc;--line:#fff2}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg2);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#stage{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,var(--bg1),var(--bg2) 75%);touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
.ui{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:12px;flex-wrap:wrap;pointer-events:none}
.top{top:env(safe-area-inset-top,0px)}.bot{bottom:env(safe-area-inset-bottom,0px);flex-direction:column;align-items:center}
.pill{pointer-events:auto;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:4px;display:flex;gap:4px}
button{font:inherit;font-size:14px;color:var(--fg);background:transparent;border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
button.on{background:var(--acc);color:#fff}
.sl{pointer-events:auto;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:8px 16px;display:flex;gap:10px;align-items:center;font-size:13px;width:min(420px,90vw);box-sizing:border-box}
.sl input{flex:1;accent-color:var(--acc)}
#deg{width:38px;text-align:right;font-variant-numeric:tabular-nums}
html.transparent,html.transparent body,html.transparent #stage,body.transparent,body.transparent #stage{background:transparent !important;--fg:#f8fafc;--panel:rgba(7,26,82,.72);--line:rgba(255,255,255,.2);--acc:#e86f12}
html.transparent .top,html.transparent .sl,html.transparent .bot,body.transparent .top,body.transparent .sl,body.transparent .bot{display:none}
html.transparent button,body.transparent button{font-size:12px;padding:7px 14px}
html.transparent button.on,body.transparent button.on{background:linear-gradient(135deg,#e86f12,#f58a1f);color:#fff;box-shadow:0 0 18px rgba(232,111,18,.45)}
</style>
<script>if(/[?&]transparent/.test(location.search))document.documentElement.classList.add('transparent');</script>
</head>
<body>
<div id="stage"></div>
<div class="ui top"><div class="pill" id="tabs">
<button data-i="0" class="on">ZFLAVA 50000</button><button data-i="1">XFLAVA Metal</button></div></div>
<div class="ui bot">
<div class="sl"><span>360°</span><input id="rot" type="range" min="0" max="360" value="0"><span id="deg">0°</span></div>
<div class="pill"><button id="auto" class="on">Auto-rotate</button><button id="reset">Reset</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(/[?&]transparent/.test(location.search))document.body.classList.add('transparent');
var T=THREE,stage=document.getElementById('stage');
var renderer=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
stage.appendChild(renderer.domElement);
var scene=new T.Scene(),cam=new T.PerspectiveCamera(30,1,0.1,100);

// studio environment for reflections
var envS=new T.Scene();
envS.add(new T.Mesh(new T.SphereGeometry(30,16,16),new T.MeshBasicMaterial({color:0x2a2e36,side:T.BackSide})));
function box(x,y,z,w,h,s,c){var m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:new T.Color(c).multiplyScalar(s),side:T.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);envS.add(m)}
box(-12,8,10,9,16,5,0xffffff);box(14,4,8,5,16,4,0xffffff);box(0,18,0,14,14,4,0xffffff);box(0,2,-16,18,6,3,0xaabbff);
var pm=new T.PMREMGenerator(renderer);scene.environment=pm.fromScene(envS,0.02).texture;
scene.add(new T.AmbientLight(0xffffff,0.25));
var key=new T.DirectionalLight(0xffffff,1.1);key.position.set(5,8,9);scene.add(key);

function tex(w,h,fn){var c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);var t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=8;return t}
function plane(w,h,t,x,y,z,emis){var m=new T.MeshStandardMaterial({map:t,transparent:true,roughness:.4,metalness:0,depthWrite:false});
 if(emis){m.emissive=new T.Color(0xffffff);m.emissiveMap=t;m.emissiveIntensity=.9}
 var p=new T.Mesh(new T.PlaneGeometry(w,h),m);p.position.set(x,y,z);p.renderOrder=5;return p}
function rbox(w,h,d,r,mat,y0){var s=new T.Shape(),x=-w/2,z=-d/2;
 s.moveTo(x+r,z);s.lineTo(x+w-r,z);s.quadraticCurveTo(x+w,z,x+w,z+r);s.lineTo(x+w,z+d-r);s.quadraticCurveTo(x+w,z+d,x+w-r,z+d);
 s.lineTo(x+r,z+d);s.quadraticCurveTo(x,z+d,x,z+d-r);s.lineTo(x,z+r);s.quadraticCurveTo(x,z,x+r,z);
 var g=new T.ExtrudeGeometry(s,{depth:h-0.06,bevelEnabled:true,bevelSize:.03,bevelThickness:.03,bevelSegments:3,curveSegments:14});
 g.rotateX(Math.PI/2);g.translate(0,h-0.03,0);var m=new T.Mesh(g,mat);m.position.y=y0;return m}
// extrude along +z rotated to +y: top at y0+h, bottom at y0
function fixed(m,w,d){return m}

var black=new T.MeshPhysicalMaterial({color:0x08090b,roughness:.22,metalness:.4,clearcoat:1,clearcoatRoughness:.08});
var glass=new T.MeshPhysicalMaterial({color:0xffffff,roughness:.04,metalness:0,transparent:true,opacity:.22,clearcoat:1,depthWrite:false});
var liquid=new T.MeshPhysicalMaterial({color:0xe9b400,roughness:.15,transparent:true,opacity:.92,emissive:0x6a4a00,emissiveIntensity:.35});
var steel=new T.MeshStandardMaterial({color:0x5a5a52,roughness:.3,metalness:1});

function screenTex(segs){return tex(512,320,function(c,w,h){
 c.fillStyle='#050608';c.fillRect(0,0,w,h);c.fillStyle='#fff';c.textAlign='center';c.font='700 34px system-ui';c.fillText('ZFLAVA',w/2,58);
 c.textAlign='left';c.font='700 128px "Courier New",monospace';c.fillText('47',40,196);c.font='700 52px system-ui';c.fillText('%',208,196);
 c.font='700 64px "Courier New",monospace';c.fillText('1.2',300,138);c.font='36px system-ui';c.fillText('Ω',410,138);
 c.fillText('',0,0);c.font='700 64px "Courier New",monospace';c.fillText('4.0',300,204);c.font='700 40px system-ui';c.fillText('W',410,204);
 for(var i=0;i<10;i++){c.fillStyle=i<segs?(i%2?'#2f6bff':'#4aa8ff'):'#3a3d46';c.fillRect(46+i*42,252,38,22)}
})}

function oval(rt,rb,h,mat,sz){var g=new T.CylinderGeometry(rt,rb,h,48);var m=new T.Mesh(g,mat);m.scale.z=sz;return m}

function buildA(){var g=new T.Group(),W=2.6,D=1.4;
 g.add(rbox(W,1.5,D,.16,black,0));
 g.add(rbox(W+.12,.1,D+.12,.18,black,1.5));
 g.add(rbox(W,1.6,D,.16,black,1.6));
 // tank
 var tank=rbox(W,2.0,D,.16,glass,3.2);tank.renderOrder=3;
 var liq=rbox(W-.12,1.55,D-.12,.14,liquid,3.25);liq.renderOrder=1;g.add(liq);
 var col=new T.Mesh(new T.CylinderGeometry(.33,.33,2.0,32),steel);col.position.y=4.2;col.scale.z=1.5;g.add(col);
 g.add(tank);
 // mouthpiece (clear)
 var mp=oval(.5,.75,.95,glass,.8);mp.position.y=5.67;mp.renderOrder=3;g.add(mp);
 var rim=oval(.58,.58,.12,glass,.8);rim.position.y=6.18;rim.renderOrder=3;g.add(rim);
 var tube=oval(.32,.32,1,black,.9);tube.position.y=5.7;g.add(tube);
 // graphics
 g.add(plane(W,3.6,tex(512,709,function(c,w,h){
  c.fillStyle='#fff';c.save();c.translate(105,625);c.rotate(-Math.PI/2);c.font='italic 900 88px system-ui';c.fillText('ZFLAVA',0,0);c.restore();
  c.save();c.translate(205,420);c.rotate(-Math.PI/2);c.font='700 54px system-ui';c.fillText('50000',0,0);c.restore();
  c.font='700 40px "Arial Narrow",system-ui';c.textAlign='left';c.fillText('MIXED GARDEN',262,500);
  c.strokeStyle='#888';c.lineWidth=3;c.beginPath();c.roundRect?c.roundRect(390,550,60,26,10):c.rect(390,550,60,26);c.stroke();
 }),0,3.4,D/2+.04));
 g.add(plane(2.0,1.25,screenTex(10),0,.78,D/2+.04,true));
 return g}

function buildB(){var g=new T.Group(),W=2.3,D=1.3;
 var metal=new T.MeshStandardMaterial({color:0x4a4b4e,roughness:.38,metalness:1,roughnessMap:tex(256,256,function(c,w,h){for(var i=0;i<h;i++){var v=110+Math.random()*70;c.fillStyle='rgb('+v+','+v+','+v+')';c.fillRect(0,i,w,1)}})});
 g.add(rbox(W,1.3,D,.45,black,0));
 g.add(rbox(W+.06,.1,D+.06,.47,black,1.3));
 g.add(rbox(W,3.5,D,.45,metal,1.4));
 g.add(rbox(W+.1,1.0,D+.1,.5,black,4.9));
 var mp=oval(.5,.55,.7,black,.8);mp.position.y=6.25;g.add(mp);
 g.add(plane(1.9,.5,tex(512,140,function(c,w,h){c.fillStyle='#fff';c.font='italic 900 76px system-ui';c.textAlign='center';c.fillText('XFLAVA',w/2+36,98)}),0,5.4,D/2+.06));
 g.add(plane(W,3.5,tex(512,780,function(c,w,h){
  c.fillStyle='#e8e8e8';c.save();c.translate(160,640);c.rotate(-Math.PI/2);c.font='italic 900 96px system-ui';c.fillText('ZFLAVA',0,0);c.restore();
  c.save();c.translate(245,300);c.rotate(-Math.PI/2);c.font='900 64px system-ui';c.lineWidth=4;c.strokeStyle='#ddd';c.strokeText('0000',0,0);c.restore();
 }),0,3.15,D/2+.04));
 g.add(plane(1.9,1.1,screenTex(5),0,.62,D/2+.04,true));
 return g}

var turn=new T.Group();scene.add(turn);
var devs=[buildA(),buildB()];
devs.forEach(function(d){d.position.y=-3.2;d.visible=false;turn.add(d)});
var shTex=tex(256,256,function(c,w,h){var g=c.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,w,h);});
var sh=new T.Mesh(new T.PlaneGeometry(4.4,4.4),new T.MeshBasicMaterial({map:shTex,transparent:true,depthWrite:false}));
sh.rotation.x=-Math.PI/2;sh.position.y=-3.32;scene.add(sh);

var initIdx=/[?&]model=xflava/.test(location.search)?1:0;
var initDist=/[?&]transparent/.test(location.search)?15.5:14;
var idx=initIdx,rot=0,auto=true,dist=initDist,drag=false,lx=0;
function show(i){idx=i;devs.forEach(function(d,j){d.visible=j===i});
 document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',+b.dataset.i===i)})}
show(initIdx);
var slider=document.getElementById('rot'),deg=document.getElementById('deg'),autoBtn=document.getElementById('auto');
function sync(){var d=((rot*180/Math.PI)%360+360)%360;slider.value=d;deg.textContent=Math.round(d)+'°'}
slider.oninput=function(){rot=slider.value*Math.PI/180;deg.textContent=slider.value+'°'};
document.getElementById('tabs').onclick=function(e){if(e.target.dataset.i!==undefined)show(+e.target.dataset.i)};
autoBtn.onclick=function(){auto=!auto;autoBtn.classList.toggle('on',auto)};
document.getElementById('reset').onclick=function(){rot=0;dist=14;elev=.08;sync()};
var elev=.08;
stage.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;ly=e.clientY;stage.setPointerCapture(e.pointerId)});
var ly=0;
stage.addEventListener('pointermove',function(e){if(!drag)return;rot+=(e.clientX-lx)*.01;elev=Math.max(-.2,Math.min(.8,elev+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY;sync()});
stage.addEventListener('pointerup',function(){drag=false});
stage.addEventListener('wheel',function(e){e.preventDefault();dist=Math.max(8,Math.min(22,dist+e.deltaY*.01))},{passive:false});
function resize(){var w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();
var last=performance.now();
(function loop(t){requestAnimationFrame(loop);var dt=(t-last)/1000;last=t;
 if(auto&&!drag){rot+=dt*.7;sync()}
 turn.rotation.y=rot;
 cam.position.set(0,Math.sin(elev)*dist,Math.cos(elev)*dist);cam.lookAt(0,0,0);
 renderer.render(scene,cam)})(last);
})();
</script>
</body>
</html>
